/* ================= the ask engine ================= */
function twinAnswer(k,q){ q=q.toLowerCase(); const p=P(k);
  if(p.off) return {held:true,why:`${p.n} isn’t on memy yet. nothing to ask.`};
  if(/birthday|gift|want|present/.test(q)) return {a:'been eyeing a film camera. second-hand is fine.',why:`${p.n} allows wishlist · ${p.tier}`};
  if(/free|weekend|friday|saturday|time|when/.test(q)) return {a:'free saturday afternoon. friday after 7 works too.',why:`${p.n} allows plans · ${p.tier}`};
  if(/food|avoid|eat|allerg|dinner|restaurant/.test(q)) return {a:'no shellfish. everything else is fair game.',why:`${p.n} allows food · ${p.tier}`};
  if(/address|phone|where.*live|money|salary|health|sick|doctor/.test(q)) return {held:true,why:`${p.n} keeps that private · held back`};
  if(/feel|mood|ok|okay|doing|happy|sad/.test(q)) return {held:true,why:`${p.n} keeps feelings on never`};
  if(/interview|job|work/.test(q)) return {a:'went well. second round next week.',why:`${p.n} allows updates · ${p.tier}`};
  return {a:'nothing i’m allowed to share on that.',why:`checked ${p.n}’s rules`}; }
function ask(k,q){ if(!q){const i=document.getElementById('cin');q=i.value.trim();if(!q)return;i.value='';}
  st.asks[k].push({dir:'out',q,st:'waiting',why:`sent to ${tw(k)}`,when:'now'}); save(); if(cur.id!=='thread'||cur.arg!==k) nav('thread',k); else render(true);
  setTimeout(()=>{ const l=st.asks[k]; const last=l[l.length-1]; const r=twinAnswer(k,q);
    if(r.held){ last.st='held'; last.why=r.why; last.a=`${P(k).n} keeps that private. want to ask them yourself?`; st.activity.unshift({ok:false,t:`your ask → ${tw(k)}`,s:`just now · ${r.why}`}); }
    else { last.st='answered'; last.a=r.a; last.why=r.why; st.activity.unshift({ok:true,t:`“${r.a.slice(0,28)}…” ← ${tw(k)}`,s:`just now · ${r.why}`}); }
    save(); render(true); },1100); }

/* ---- HOME: chat with your twin ---- */

  {w:'twin',t:'a few worth asking today:',chips:[['what does my best friend want for their birthday?'],['how did my sister’s interview go?'],['when is everyone free for friday dinner?'],['who else can i ask?']]},

];

const whoIn=q=>{q=q.toLowerCase(); if(/group|everyone|dinner/.test(q)) return 'group'; for(const k of Object.keys(PEOPLE)){ const n=P(k).n; if(q.includes(n)) return k; } if(/\bbf\b/.test(q)) return 'bf'; return null; };
const chatMsg=(x,i,arr)=>{const prev=arr[i-1];
  if(x.w==='you') return `${prev&&prev.w==='you'?'':'<div class="who r">you</div>'}<div class="bub me">${x.t}</div>`;

screens.ask=()=>`${bg('home')}<div class="top" style="gap:10px"><div class="hdrchat">${av('me','md')}<div><b>${twin()}</b><span>answers within your rules</span></div></div><div class="sp"></div><button class="act" onclick="openSheet('help')" aria-label="how it works" style="padding:6px 8px">${octoSvg(22)}</button></div>
<div class="body bottomPad" id="thread"><div class="chat"><div class="day">today</div>${homeLog().map(chatMsg).join('')}</div></div>${composer(`ask ${twin()}…`,"sendTwin()")}${tabs('ask')}`;

function sendTwin(q){ if(!q){const i=document.getElementById('cin');q=i.value.trim();if(!q)return;i.value='';} pushHome({w:'you',t:q}); const lq=q.toLowerCase();
  if(/introduce/.test(lq)){ setTimeout(()=>openSheet('intro'),400); return; }
  const k=whoIn(q);
  if(/link twins/.test(lq)&&k&&k!=='group'){ requestLink(k); pushHome({w:'twin',t:`asked ${tw(k)} to link. nothing moves until they say yes.`}); return; }
  if(/accept link/.test(lq)&&k&&k!=='group'){ acceptLink(k); pushHome({w:'twin',t:`linked. ask me anything about your ${P(k).n} now.`}); return; }
  if(k==='group'){ const un=st.groups.dinner.m.filter(m=>!linked(m)); if(un.length){ pushHome({w:'twin',t:`i can only ask linked twins. your ${un.map(m=>P(m).n).join(' and ')} isn’t linked yet.`,chips:un.map(m=>[`link twins with my ${P(m).n}`])}); return; } pushHome({w:'typing',t:'asking both twins…'}); setTimeout(()=>{ const r=/food|avoid|eat/.test(lq)?['best friend: no shellfish. sister: anything.','2 of 2 · food']:/bring/.test(lq)?['sister is bringing something sweet. best friend hasn’t decided.','2 of 2 · plans']:['both free friday after 7:30. your sister can’t do saturday.','2 of 2 · plans · close']; popTyping();pushHome({w:'memy',t:` ${r[0]} <span class="src">(${r[1]})</span>`}); st.activity.unshift({ok:true,t:'group ask → friday dinner',s:`just now · ${r[1]}`}); save(); },1300); return; }
  if(k&&L(k)==='none'){ pushHome({w:'twin',t:`your ${P(k).n} is on memy, but our twins aren’t linked yet. want me to ask theirs to link?`,chips:[[`link twins with my ${P(k).n}`]]}); return; }
  if(k&&L(k)==='pending'){ pushHome({w:'twin',t:`still waiting on your ${P(k).n} to say yes. i’ll tell you the moment they do.`}); return; }
  if(k&&L(k)==='request'){ pushHome({w:'twin',t:`your ${P(k).n}’s twin asked to link with me. say yes and i can ask it things.`,chips:[[`accept link with my ${P(k).n}`]]}); return; }
  if(k&&linked(k)){ pushHome({w:'typing',t:`asking ${tw(k)}…`}); st.asks[k].push({dir:'out',q,st:'waiting',why:'from your twin chat',when:'now'});
    setTimeout(()=>{ const r=twinAnswer(k,q); const l=st.asks[k]; const last=l[l.length-1];
      popTyping(); if(r.held){ last.st='held'; last.why=r.why; last.a='kept private'; pushHome({w:'other',k,held:true,t:'that stays private.',src:r.why}); pushHome({w:'twin',t:`their rules, not mine. want me to draft a message so you can ask them yourself?`,chips:[['draft a whatsapp message']]}); st.activity.unshift({ok:false,t:`your ask → ${tw(k)}`,s:`just now · ${r.why}`}); }
      else { last.st='answered'; last.a=r.a; last.why=r.why; pushHome({w:'other',k,t:r.a,src:r.why}); st.activity.unshift({ok:true,t:`“${r.a.slice(0,26)}…” ← ${tw(k)}`,s:`just now · ${r.why}`}); }
      save(); },1100); return; }
  if(k&&L(k)==='off'){ st.lastQ=q; pushHome({w:'twin',t:`your ${P(k).n} isn’t on memy yet, so there’s no twin to ask. i can draft a whatsapp message you send yourself.`,chips:[[`draft it for my ${P(k).n}`],[`invite my ${P(k).n} with a memory`]]}); return; }
  if(k&&L(k)==='paused'){ pushHome({w:'twin',t:`paused with your ${P(k).n} for the week. want me to resume?`,chips:[[`resume with my ${P(k).n}`]]}); return; }
  if(/resume with/.test(lq)&&k){ st.links[k]='linked'; save(); pushHome({w:'twin',t:`resumed. ask away.`}); return; }
  if(/draft it/.test(lq)&&k){ setTimeout(()=>openSheet('draft',k,st.lastQ),300); return; }
  if(/invite my/.test(lq)&&k){ const m=st.memories.find(x=>x.k===k); setTimeout(()=>openSheet('share',m?m.id:'lisbon'),300); return; }
  if(/what would you say about me|what do you say about me|preview/.test(lq)){ pushHome({w:'twin',t:`depends who’s asking. pick one and i’ll show you exactly what i’d let through.`,chips:Object.keys(PEOPLE).filter(linked).map(a=>[`preview for my ${P(a).n}`])}); return; }
  if(/preview for/.test(lq)&&k){ setTimeout(()=>openSheet('preview',k),300); return; }
  if(/memor/.test(lq)){ setTimeout(()=>nav('memories'),300); return; }
  if(/pause|unlink|quiet/.test(lq)&&k){ setTimeout(()=>openSheet('pause',k),300); return; }
  if(/invite/.test(lq)){ setTimeout(()=>openSheet('invite','of'),300); return; }
  if(/draft/.test(lq)&&!k){ pushHome({w:'twin',t:'drafted in whatsapp: “quick one, what’s your address? sending something.” you send it.',src:'you send, i never do'}); return; }
  if(/who else|who can i ask/.test(lq)){ pushHome({w:'twin',t:`linked: ${Object.keys(PEOPLE).filter(linked).map(k=>P(k).n).join(', ')||'nobody yet'}. on memy but not linked: ${Object.keys(PEOPLE).filter(k=>['none','pending','request'].includes(L(k))).map(k=>P(k).n).join(', ')||'nobody'}. not on memy: ${Object.keys(PEOPLE).filter(k=>L(k)==='off').map(k=>P(k).n).join(', ')}.`,chips:Object.keys(PEOPLE).filter(k=>L(k)==='none').map(k=>[`link twins with my ${P(k).n}`]).concat(Object.keys(PEOPLE).filter(k=>L(k)==='request').map(k=>[`accept link with my ${P(k).n}`]))}); return; }
  if(/show the memory/.test(lq)){ setTimeout(()=>openSheet('share','slots'),300); return; }
  if(/owe|promise/.test(lq)) { pushHome({w:'twin',t:'you owe your sister the lisbon list. you said “tonight” on tuesday.',src:'your chat · tue 21:14'}); return; }
  if(/birthday/.test(lq)) { pushHome({w:'twin',t:'your best friend’s birthday is friday. want me to ask their twin what they want?',chips:[['what does my best friend want for their birthday?']]}); return; }
  pushHome({w:'twin',t:'who should i ask?',chips:Object.entries(PEOPLE).filter(([a,p])=>!p.off).map(([a,p])=>[`ask my ${p.n}: ${q}`]).concat([[`ask the dinner group: ${q}`]])}); }

  else { save(); render(true); toast(`sent to ${tw(x.from)}`); } }

/* ---- MEMORIES ---- */
screens.memories=()=>`${bg('warm')}${hdr(true,'co-owned memories')}<div class="body bottomPad">
  <h1 style="font-size:26px">a year ago today</h1>
  <p class="note">moments ${twin()} found in your chats. share one and you both keep it. people not on memy get the card and a link.</p>
  <div class="stag" style="display:flex;flex-direction:column;gap:12px">${st.memories.map(m=>`<div class="memory" style="cursor:pointer" onclick="openSheet('share','${m.id}')"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">${av(m.k,'sm')}<span class="k" style="letter-spacing:.04em">you · ${P(m.k).n} · ${m.when}</span><span style="flex:1"></span>${m.st==='shared'?'<span class="chip on" style="padding:3px 9px;font-size:11px">shared</span>':L(m.k)==='off'?'<span class="chip out" style="padding:3px 9px;font-size:11px">invite</span>':''}</div><b>${m.t}</b><span>${m.src}</span></div>`).join('')}</div>
</div>${tabs('people')}`;
sheets.share=id=>{const m=st.memories.find(x=>x.id===id);const k=m.k;const off=L(k)==='off';
  if(m.st==='shared') return `${av(k,'md')}<div class="eyebrow">shared with ${P(k).n}</div><div class="memory"><b>${m.t}</b><span>${m.src} · both of you can see this · either can delete</span></div><button class="btn g" onclick="closeSheet();openSheet('received','${id}')">see what they got</button><button class="btn t" onclick="st.memories=st.memories.filter(x=>x.id!=='${id}');save();closeSheet();render(true);toast('deleted for both')">delete for both</button>`;
  return `${av(k,'md')}<div class="eyebrow">${m.when}</div><div class="memory"><b>${m.t}</b><span>${m.src}</span></div>
  ${memy(off?`${P(k).n} isn’t on memy. they get this card on whatsapp with a link, and nothing else from your cell. if they join, you’re linked from day one.`:`${P(k).n} gets this card. nothing else from your cell. you both own it from then on.`)}
  <button class="btn ${off?'wa':''}" onclick="shareMemory('${id}')">${off?'send card + invite on whatsapp':'share with '+P(k).n}</button>
  <button class="btn g" onclick="closeSheet();openSheet('received','${id}')">preview what they see</button>
  <button class="btn t" onclick="closeSheet()">keep it to myself</button>`};
function shareMemory(id){ const m=st.memories.find(x=>x.id===id); m.st='shared'; st.activity.unshift({ok:true,t:`memory card → ${P(m.k).n}`,s:`just now · co-owned${L(m.k)==='off'?' · with invite':''}`}); if(L(m.k)==='off') st.links[m.k]='pending'; save(); closeSheet(); render(true); toast(L(m.k)==='pending'?'sent on whatsapp · link waits for them':'shared · you both keep it');
  if(L(m.k)==='pending') setTimeout(()=>{ st.links[m.k]='linked'; st.activity.unshift({ok:true,t:`twins linked ↔ ${P(m.k).n}`,s:'just now · they joined from your card'}); save(); render(true); toast(`${P(m.k).n} joined memy. twins linked.`); },8000); }
sheets.received=id=>{const m=st.memories.find(x=>x.id===id);const k=m.k;const off=L(k)==='off';
  return `<div class="eyebrow">what ${P(k).n} sees</div>
  <div style="width:100%;border-radius:22px;background:#f4f4f5;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left">
    <div style="font-size:11px;color:var(--ink3)">${off?'whatsapp · from you':'memy · from '+twin()}</div>
    <div class="memory" style="background:#fff"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">${octoSvg(22)}<span class="k">a memory you share</span></div><b>${m.t}</b><span>${m.src.replace('your chat','your chat together')}</span></div>
    ${off?`<div class="card" style="background:#fff"><b>memy.app/m/4k2p</b>open to keep it. your twin starts linked with ${st.name||'your friend'}.</div>`:`<div style="display:flex;gap:8px"><span class="chip on">keep it</span><span class="chip">reply</span><span class="chip">delete</span></div>`}
    <div class="note">they see this card and nothing else from your cell.</div>
  </div>
  <button class="btn" onclick="closeSheet()">ok</button>`};

/* ---- PEOPLE ---- */
screens.people=()=>`${bg('green')}<div class="top"><div class="sp"></div><button class="act" onclick="nav('memories')">memories${st.memories.filter(m=>m.st==='new').length?` · ${st.memories.filter(m=>m.st==='new').length}`:''}</button><button class="act" onclick="nav('group','dinner')">${octoSvg(18)}groups</button></div><div class="body bottomPad">
  <h1>people</h1><p class="note">who ${twin()} can ask, and who can ask it.</p>
  <div class="stag" style="display:flex;flex-direction:column;gap:12px">${Object.entries(PEOPLE).map(([k,p])=>row(p.n,`${LT[L(k)]}${linked(k)?` · ${p.tier} · ${(st.asks[k]||[]).length} asks`:''}`,`nav('person','${k}')`,'',av(k,'md'))).join('')}</div>
</div>${tabs('people')}`;
screens.person=k=>{const p=P(k);
 return `${bg(p.off?'slate':'orange')}${hdr(true,'',linked(k)||L(k)==='paused'?`<button class="act" onclick="nav('rules','${k}')">rules</button>`:'')}<div class="body bottomPad">
  <div style="display:flex;align-items:center;gap:12px">${av(k,'lg')}<div><h1 style="font-size:26px">${p.n}</h1><p class="note">${LT[L(k)]}${linked(k)&&p.next?' · '+p.next:''}</p></div></div>
  ${L(k)==='off'?`<div class="card"><b>what ${twin()} knows about them stays with you.</b>nothing is shared with anyone, including their twin if they join later.</div><button class="btn" onclick="openSheet('draft','${k}')">ask them on whatsapp · i draft, you send</button>`:L(k)==='paused'?`<div class="card"><b>paused.</b>${tw(k)} gets nothing from yours for 7 days, and yours asks nothing. links stay.</div><button class="btn" onclick="st.links['${k}']='linked';save();render(true);toast('resumed')">resume</button>`:L(k)==='linked'?`<button class="btn" onclick="nav('thread','${k}')">ask ${tw(k)}</button><div style="display:flex;gap:8px"><button class="btn g" style="height:44px;font-size:14px" onclick="openSheet('preview','${k}')">what would my twin say?</button><button class="btn g" style="height:44px;font-size:14px" onclick="openSheet('pause','${k}')">pause · unlink</button></div>`:L(k)==='request'?`<div class="card"><b>${tw(k)} asked to link with yours.</b>once linked, each twin answers the other within its owner’s rules.</div><button class="btn" onclick="acceptLink('${k}')">accept · link twins</button>`:L(k)==='pending'?`<div class="card"><b>link request sent.</b>i’ll tell you when they say yes. nothing is asked until then.</div>`:`<div class="card"><b>on memy, not linked yet.</b>twins only talk once both of you say yes.</div><button class="btn" onclick="requestLink('${k}')">link twins</button>`}
  <div class="k">what ${twin()} knows</div>
  ${p.bits.map(b=>`<div class="row h static"><b>${b}</b></div>`).join('')}
  ${L(k)==='off'?`<button class="btn g" onclick="openSheet('share','${st.memories.find(m=>m.k===k)?st.memories.find(m=>m.k===k).id:'lisbon'}')">invite with a memory</button>`:!linked(k)?'':`<div class="k">what ${tw(k)} can get from yours</div><p class="note">${Object.entries(st.rules).filter(([a,v])=>v==='always').map(([a])=>a).join(', ')||'nothing automatically'} on its own · ${Object.entries(st.rules).filter(([a,v])=>v==='ask').map(([a])=>a).join(', ')||'nothing'} after asking you · never: ${Object.entries(st.rules).filter(([a,v])=>v==='never').map(([a])=>a).join(', ')}</p>`}
</div>${tabs('people')}`};
screens.rules=k=>{const p=P(k);return `${bg('steel')}${hdr(true,'rules')}<div class="body bottomPad">
  <div style="display:flex;align-items:center;gap:12px">${av(k,'md')}<div><h1 style="font-size:24px">what ${tw(k)} may get</h1></div></div>
  <div class="k">tier</div>
  <div class="chips">${['close','friends','work','outside'].map(t=>`<span class="chip ${p.tier===t?'on':''} ${t==='outside'?'out':''}" onclick="PEOPLE['${k}'].tier='${t}';render(true)">${t}</span>`).join('')}</div>
  <div class="k">inside ${p.tier}</div>
  <div class="row h static"><b>plans</b><span class="pick">${pick('plans')}</span></div>
  <div class="row h static"><b>food</b><span class="pick">${pick('food')}</span></div>
  <div class="row h static"><b>wishlist</b><span class="pick">${pick('wishlist')}</span></div>
  <div class="row h static"><b>feelings</b><span class="pick">${pick('feelings')}</span></div>
  <div class="row h static"><b>health · grief · money</b><span class="pick">${pick('sensitive')}</span></div>
  <p class="note">always: ${twin()} answers on its own. ask: it checks with you first. never: it says no.</p>
</div>${tabs('people')}`};

/* ---- YOU ---- */
screens.you=()=>`${bg('steel')}<div class="top"><div class="sp"></div></div><div class="body bottomPad">
  <div style="display:flex;align-items:center;gap:12px">${av('me','lg')}<div><h1 style="font-size:26px">${twin()}</h1><p class="note">answers for you, only within your rules.</p></div></div>
  ${memy(`only you can see what it keeps. i can’t read it either.`)}
  <div class="stag" style="display:flex;flex-direction:column;gap:12px">
  ${row('what would it say about me?','preview per person, with your rules as they are',"openSheet('preview','bf')")}
  ${row('what it knows',`${st.kept.length} things`,"nav('kept')")}
  ${row('what it answered',`${st.activity.filter(a=>a.ok).length} out · ${st.activity.filter(a=>!a.ok).length} held`,"nav('activity')")}
  ${row('held back for everyone','health · grief · money · address',"nav('defaults')")}
  ${row('reads from',[st.wa&&'whatsapp',st.gmail&&'gmail',st.contacts&&'contacts',st.calendar&&'calendar'].filter(Boolean).join(' · ')||'nothing yet',"nav('sources')")}
  ${row('where it runs','memy cloud · key held by you',"openSheet('runs')")}
  ${row('delete everything','gone for good',"openSheet('delete')")}
  </div>
  <button class="btn t" onclick="openSheet('reset')">prototype · start the demo over</button>
</div>${tabs('you')}`;
screens.kept=()=>`${bg('slate')}${hdr(true,`what ${twin()} knows`)}<div class="body bottomPad">
  <div class="field" style="padding:10px 16px">${I.search}<input placeholder="search" style="font-size:16px" oninput="filterKept(this.value)"></div>
  <div id="keptlist">${keptList()}</div>
  <p class="note">tap to forget. everything built on it goes too.</p>
</div>${tabs('you')}`;
function keptList(q=''){ return st.kept.filter(k=>k.t.includes(q.toLowerCase())).map(k=>row(k.t,k.s,`openSheet('forget',${k.id})`)).join('')||'<p class="note">nothing matches.</p>'; }
function filterKept(q){ document.getElementById('keptlist').innerHTML=keptList(q); }
screens.activity=()=>`${bg('indigo')}${hdr(true,'what it answered')}<div class="body bottomPad">
  <div class="card" style="padding:4px 16px">${st.activity.map(a=>`<div class="log"><i class="${a.ok?'ok':'no'}"></i><div>${a.t}<small>${a.s}</small></div></div>`).join('')}</div>
</div>${tabs('you')}`;
screens.sources=()=>`${bg('green')}${hdr(true,'reads from')}<div class="body bottomPad">
  <h1>sources</h1><p class="note">each one stays inside your cell. turn off to stop reading.</p>
  <div class="row h static"><b>whatsapp</b>${tog('wa')}</div>
  <div class="row h static"><b>gmail</b>${tog('gmail')}</div>
  <div class="row h static"><b>contacts</b>${tog('contacts')}</div>
  <div class="row h static"><b>calendar</b>${tog('calendar')}</div>
  <div class="row h static"><b>imessage / sms</b>${tog('imessage')}</div>
  <div class="row h static"><b>import chatgpt / claude history</b>${tog('imports')}</div>
</div>${tabs('you')}`;
screens.defaults=()=>`${bg('indigo')}${hdr(true,'for everyone, unless you say otherwise')}<div class="body bottomPad">
  <h1>held back</h1>
  <div class="row h static"><b>health</b>${tog('health','st.held')}</div>
  <div class="row h static"><b>grief</b>${tog('grief','st.held')}</div>
  <div class="row h static"><b>money</b>${tog('money','st.held')}</div>
  <div class="row h static"><div class="l"><b>ask me before anything new</b><span>${twin()} checks first</span></div>${tog('pause','st.held')}</div>
  <div class="row h static"><div class="l"><b>outside agents can’t instruct</b><span>their asks are questions, never orders</span></div>${tog('outside','st.held')}</div>
  <div class="row h static"><div class="l"><b>answers only</b><span>${twin()} never messages people, only twins</span></div>${tog('readonly','st.held')}</div>
</div>${tabs('you')}`;

/* ---- sheets ---- */
sheets.help=()=>`${octoSvg(72)}<h2>how memy works</h2><p class="note">i’m the octopus in the middle. same for everyone, never for sale.</p>
  <div class="card" onclick="closeSheet();tab('people')"><b>twins link first</b>both of you say yes. until then nothing is asked or answered. unlink any time.</div>
  <div class="card" onclick="closeSheet();nav('thread','bf')"><b>ask someone’s twin</b>${twin()} asks, their twin checks their rules, i carry the answer. they’re never pinged.</div>
  <div class="card" onclick="closeSheet();tab('inbox')"><b>they ask about you</b>your twin answers on its own where you allow, asks you where you said “ask”, and says no where you said never.</div>
  <div class="card" onclick="closeSheet();nav('rules','bf')"><b>rules per person</b>a tier, then topics inside it. always · ask · never.</div>
  <div class="card" onclick="closeSheet();nav('memories')"><b>memory cards</b>moments you share. the other person keeps the card and nothing else. if they’re not on memy, it’s the invite.</div>
  <div class="card" onclick="closeSheet();nav('activity')"><b>every answer is logged</b>what left, what was held, and why.</div>
  <button class="btn t" onclick="closeSheet()">close</button>`;
sheets.intro=()=>`${octoSvg(72)}<div class="eyebrow">a possible introduction</div><h2>you and your work friend both want berlin in june</h2>
  ${memy('both twins flagged it. theirs already said yes. nothing is revealed until you both agree.')}
  <div class="card"><b>what they’d see</b>“in berlin in june, building something in travel too.”</div>
  <button class="btn" onclick="st.introDone=true;st.asks.wf.push({dir:'in',q:'in berlin 12–20 june. would like to meet.',st:'kept',why:'double opt-in · both said yes',when:'now'});st.activity.unshift({ok:true,t:'intro note → work friend’s twin',s:'just now · double opt-in'});save();closeSheet();nav('thread','wf');toast('introduced')">yes, introduce us</button>
  <button class="btn t" onclick="closeSheet()">not now</button>`;
sheets.invite=k=>`${av(k,'md')}<div class="eyebrow">${P(k).n} isn’t on memy yet</div><h2>send a memory as the invite?</h2>
  <div class="memory"><b>three years since lisbon. the night the tram broke down and you walked home singing.</b><span>group chat · lisbon 2023</span></div>
  <p class="note">they get this card and a whatsapp link. once they’re on, you can ask their twin.</p>
  <button class="btn wa" onclick="closeSheet();toast('invite sent on whatsapp')">send on whatsapp</button>
  <button class="btn t" onclick="closeSheet()">skip</button>`;
sheets.pause=k=>`${av(k,'md')}<h2>pause or unlink ${tw(k)}?</h2>${memy('pausing keeps the link but stops both twins talking for a week. unlinking cuts it. they get a plain note either way, no reason attached.')}
  <button class="btn" onclick="st.links['${k}']='paused';st.activity.unshift({ok:false,t:'paused ↔ ${P(k).n}',s:'just now · 7 days'});save();closeSheet();render(true);toast('paused for 7 days')">pause for a week</button>
  <button class="btn g" onclick="st.links['${k}']='none';st.activity.unshift({ok:false,t:'unlinked ↔ ${P(k).n}',s:'just now · you'});save();closeSheet();render(true);toast('unlinked')">unlink</button>
  <button class="btn t" onclick="closeSheet()">cancel</button>`;
sheets.preview=k=>{const p=P(k);const r=st.rules;const line=(cat,ans)=>`<div class="row h static" style="padding:12px 14px"><div class="l"><span>${cat}</span><b style="font-size:14px">${r[cat==='health · grief · money'?'sensitive':cat]==='always'?'“'+ans+'”':r[cat==='health · grief · money'?'sensitive':cat]==='ask'?'asks you first':'“that stays private.”'}</b></div><span class="tag">${r[cat==='health · grief · money'?'sensitive':cat]}</span></div>`;
  return `${av(k,'md')}<div class="eyebrow">if ${tw(k)} asked</div><h2>what ${twin()} would say about you</h2>${memy(`this is exactly what i’d let through for ${p.n}, today, with your rules as they are.`)}
  <div style="width:100%;display:flex;flex-direction:column;gap:8px">${line('plans','free saturday afternoon')}${line('food','in the mood for dumplings')}${line('wishlist','a film camera, second-hand is fine')}${line('feelings','')}${line('health · grief · money','')}</div>
  <button class="btn g" onclick="closeSheet();nav('rules','${k}')">change the rules</button><button class="btn t" onclick="closeSheet()">looks right</button>`};
sheets.draft=(k,q)=>{const p=P(k);const msg=q?`quick one: ${q.replace(/^(what|when|is|are|does|do)\s/i,'').replace(/\?$/,'')}? no rush.`:`hey, quick one. are you around friday? no rush.`;
  return `${av(k,'md')}<div class="eyebrow">${p.n} isn’t on memy</div><h2>i’ll draft it. you send it.</h2>${memy('no twin to ask, so this goes as a normal whatsapp message from you. i never send on my own.')}
  <div class="card" style="font-size:16px;color:var(--ink)" id="draftbox">${msg}</div>
  <button class="btn wa" onclick="closeSheet();toast('opened in whatsapp (demo)')">open in whatsapp</button>
  <button class="btn g" onclick="closeSheet();openSheet('share','${(st.memories.find(x=>x.k===k)||{id:'lisbon'}).id}')">add a memory card to it</button>
  <button class="btn t" onclick="closeSheet()">not now</button>`};
sheets.runs=()=>`<div class="eyebrow">your cell</div><h2>a machine only you can unlock</h2>
  <div class="card" style="border:1px solid rgba(0,0,0,.4)"><b>memy cloud ✓</b>always on. the key stays with you, we never see it.</div>
  <div class="card" onclick="toast('switching takes a few minutes (demo)')"><b>my own computer</b>runs on your mac. nothing leaves home.</div>
  <p class="note">your raw messages never leave the cell. only answers your rules allow do.</p>
  <button class="btn" onclick="closeSheet()">done</button>`;
sheets.forget=id=>{const k=st.kept.find(x=>x.id===id);return `<h2>forget “${k.t}”?</h2><p class="note">gone from your cell. any twin that got it from yours forgets it too.</p>
  <button class="btn" onclick="st.kept=st.kept.filter(x=>x.id!==${id});save();closeSheet();render(true);toast('forgotten')">forget</button><button class="btn t" onclick="closeSheet()">keep</button>`};
sheets.reset=()=>`${octoSvg(72)}<h2>start over?</h2><p class="note">clears the demo and goes back to signup.</p><button class="btn" onclick="resetAll()">start over</button><button class="btn t" onclick="closeSheet()">cancel</button>`;
sheets.delete=()=>`<h2>delete everything?</h2><p class="note">${twin()} is deleted with your cell. answers already given stay with the twins that got them.</p>
  <button class="btn d" onclick="resetAll();toast('deleted')">delete</button><button class="btn t" onclick="closeSheet()">cancel</button>`;
function openSheet(id,arg,arg2){ sheet(sheets[id](arg,arg2)); }

/* ================= boot ================= */
nav(st.onboarded?'ask':'welcome');
document.body.insertAdjacentHTML('beforeend','<div class="demo" onclick="openSheet(\'reset\')">prototype v20 · tap to start over</div>');
</script>

</body>
